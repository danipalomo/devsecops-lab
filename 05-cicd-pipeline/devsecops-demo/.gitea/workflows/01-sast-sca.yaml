name: 01 - SAST & SCA Security Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose

  trivy-scan:
    name: SAST & IaC Scan (Trivy)
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Escaneo de Manifiestos K8s y Código
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/root/workspace aquasec/trivy:latest config /root/workspace
