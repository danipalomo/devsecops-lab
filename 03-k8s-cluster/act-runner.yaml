apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-config
  namespace: gitea
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      envs:
        DOCKER_HOST: unix:///var/run/docker.sock
      timeout: 3h
      insecure: true
      labels:
        - "ubuntu-latest:docker://node:16-bullseye"
        - "ubuntu-22.04:docker://node:16-bullseye"
        - "ubuntu-20.04:docker://node:16-bullseye"
    container:
      network: "bridge"
      privileged: true
      force_pull: false
      rm: true # 1. Borra automáticamente los contenedores de los jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
    spec:
      initContainers:
      - name: init-runner-permissions
        image: busybox:latest
        command: ['sh', '-c', 'chown -R 0:0 /data /root/.cache && chmod -R 777 /data /root/.cache']
        volumeMounts:
        - name: runner-data
          mountPath: /data
        - name: act-cache
          mountPath: /root/.cache/act
      containers:
      - name: runner
        image: gitea/act_runner:latest
        command:
        - sh
        - -c
        - |
          if [ ! -f /data/.runner ]; then
            act_runner register --config /etc/act_runner/config.yaml --instance http://192.168.252.10:30000 --token y2HtdzweXvxJ4g11FGxcByl8A2DjH1UiU6tpXYGl --name k3s-devsecops-runner --no-interactive
          fi
          act_runner daemon --config /etc/act_runner/config.yaml
        securityContext:
          privileged: true
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: runner-data
          mountPath: /data
        - name: act-cache
          mountPath: /root/.cache/act # 2. Aísla la descarga de acciones en memoria RAM/Tmpfs
        - name: config
          mountPath: /etc/act_runner
        resources:
          limits:
            memory: "4Gi"
            cpu: "4000m"
          requests:
            memory: "512Mi"
            cpu: "250m" # 3. Evita estrangulamiento de CPU (Throttling)
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
      - name: runner-data
        hostPath:
          path: /var/lib/act-runner-data
          type: DirectoryOrCreate
      - name: act-cache
        emptyDir: {}
      - name: config
        configMap:
          name: act-runner-config
