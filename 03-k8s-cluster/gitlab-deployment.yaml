apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ce
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-ce
  template:
    metadata:
      labels:
        app: gitlab-ce
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest
        env:
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://192.168.252.10:30088'
            nginx['listen_port'] = 80
            gitlab_rails['gitlab_shell_ssh_port'] = 32222
        ports:
        - containerPort: 80
          name: http
        - containerPort: 22
          name: ssh
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-service
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab-ce
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30088
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 32222
